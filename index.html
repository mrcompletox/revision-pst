<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Revision PST 50/50</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 16px;
        background: #111;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        min-height: 100dvh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
        user-select: none;
      }

      .header {
        max-width: 420px;
      }

      h1 {
        font-size: clamp(20px, 5.5vw, 28px);
        margin: 0;
        letter-spacing: 1px;
      }

      .sub {
        color: #aaa;
        font-size: clamp(12px, 3.4vw, 14px);
        margin-top: 4px;
      }

      .s {
        background: #222;
        border-radius: 28px;
        padding: clamp(18px, 4vw, 26px) clamp(24px, 7vw, 36px);
        display: flex;
        flex-direction: column;
        gap: clamp(16px, 3.5vw, 24px);
        border: 4px solid #333;
      }

      .l {
        width: clamp(96px, 26vw, 130px);
        height: clamp(96px, 26vw, 130px);
        border-radius: 50%;
        background: #111;
        border: 5px solid #000;
        opacity: 0.15;
        transition:
          opacity 0.15s ease,
          box-shadow 0.15s ease;
      }

      .l.aR {
        background: radial-gradient(#ff8a8a, #ff0000 40%, #cc0000);
        opacity: 1;
        box-shadow: 0 0 45px #ff0000;
      }

      .l.aV {
        background: radial-gradient(#8affa8, #00ff44 40%, #00aa2e);
        opacity: 1;
        box-shadow: 0 0 45px #00ff44;
      }

      .estado {
        min-height: 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      #t {
        font-size: clamp(32px, 10vw, 44px);
        font-weight: 900;
        line-height: 1.1;
      }

      #subt {
        color: #ccc;
        font-size: clamp(14px, 4vw, 17px);
        margin-top: 6px;
      }

      button {
        width: min(100%, 320px);
        padding: 18px 32px;
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 900;
        border-radius: 999px;
        border: 0;
        background: #fff;
        color: #111;
        box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        touch-action: manipulation;
        cursor: pointer;
      }

      button:active:not(:disabled) {
        transform: scale(0.97);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .stats {
        color: #777;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>REVISION ALEATORIA</h1>
      <div class="sub">INVERSIONES PST - 50% / 50% - Calera de Tango</div>
    </div>

    <div class="s">
      <div id="r" class="l"></div>
      <div id="v" class="l"></div>
    </div>

    <div class="estado">
      <div id="t">PRESIONA</div>
      <div id="subt">para sortear</div>
    </div>

    <button id="btn" onclick="g()">🎲 GENERAR</button>

    <div class="stats">
      🔴 <span id="cr">0</span> | 🟢 <span id="cv">0</span> | Total:
      <span id="ct">0</span>
    </div>

    <script>
      let R = 0,
        V = 0,
        corriendo = false;

      function g() {
        if (corriendo) return;
        corriendo = true;

        const btn = document.getElementById("btn");
        const t = document.getElementById("t");
        const st = document.getElementById("subt");
        const r = document.getElementById("r");
        const v = document.getElementById("v");

        btn.disabled = true;
        t.textContent = "...";
        t.style.color = "#fff";
        st.textContent = "SORTEANDO";

        let f = 0;
        const i = setInterval(() => {
          const par = f % 2 === 0;
          r.className = par ? "l aV" : "l aR";
          v.className = par ? "l aR" : "l aV";
          f++;

          if (f > 10) {
            clearInterval(i);
            const rojo = Math.random() < 0.5;
            r.className = rojo ? "l aR" : "l";
            v.className = rojo ? "l" : "l aV";

            if (rojo) {
              t.textContent = "ROJO";
              t.style.color = "#ff3333";
              st.textContent = "¡REVISION OBLIGATORIA!";
              R++;
              try {
                navigator.vibrate([200, 100, 200]);
              } catch (e) {}
            } else {
              t.textContent = "VERDE";
              t.style.color = "#00ff55";
              st.textContent = "PASE LIBRE";
              V++;
              try {
                navigator.vibrate(100);
              } catch (e) {}
            }

            document.getElementById("cr").textContent = R;
            document.getElementById("cv").textContent = V;
            document.getElementById("ct").textContent = R + V;
            btn.disabled = false;
            corriendo = false;
          }
        }, 100);
      }
    </script>
  </body>
</html>
